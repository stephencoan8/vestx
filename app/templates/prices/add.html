{% extends "base.html" %}

{% block title %}Add pre-IPO price - VestX{% endblock %}

{% block content %}
<div class="page">
    <header class="page-header">
        <div>
        <p class="chap">Apparatus</p>
        <h1>Add a mark.</h1>
        </div>
    </header>

    <div class="form-card">
        <form method="post" action="{{ url_for('prices.add_price') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="date">Valuation date</label>
                <input type="date" id="date" name="date" required max="{{ cutover.isoformat() }}">
            </div>

            <div class="form-group">
                <label for="price">Stock price (USD)</label>
                <input type="number" step="0.01" id="price" name="price" placeholder="0.00" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add price</button>
                <a href="{{ url_for('settings.profile', _anchor='pre-ipo-prices') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
